name: Keep Supabase warm

# Free-tier Supabase pauses after ~7 days of inactivity. This pings a tiny
# endpoint daily so the project keeps registering API activity and never pauses.
# Note: GitHub disables scheduled workflows after 60 days with no repo commits.

on:
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 "https://tether-us.vercel.app/api/keepalive")
          echo "HTTP $code"
          cat /tmp/body || true
          echo
          test "$code" = "200"
